<style>

const canSpeak='speechSynthesis' in window;
let VOICE=null;
const NOVEL=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB|AU|IE|CA)/i.test(v.lang)&&!NOVEL.test(v.name));let best=null,bs=-1;for(const v of vs){let sc=0;if(/premium/i.test(v.name))sc+=6;if(/enhanced|natural|neural/i.test(v.name))sc+=4;if(/Ava|Samantha|Zoe|Allison|Susan|Evan|Nathan|Serena|Daniel|Karen|Moira/i.test(v.name))sc+=2;if(/^en[-_]US/i.test(v.lang))sc+=1;if(sc>bs){bs=sc;best=v}}VOICE=best}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function say(list,done,rate=.8){if(!canSpeak){if(done)done();return}try{speechSynthesis.cancel();const arr=Array.isArray(list)?list:[list];let fired=false;const fin=()=>{if(!fired){fired=true;if(done)done()}};arr.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'en-US';if(VOICE)u.voice=VOICE;u.rate=rate;if(i===arr.length-1){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)});if(done)setTimeout(fin,2500+arr.join(' ').length*120)}catch(e){if(done)done()}}
const speak=t=>say(t);
const spellSay=w=>say([...w.toUpperCase().replace(/[^A-Z]/g,'')].join(', ')+'. '+w+'.',null,.7);

function loadScript(urls){return new Promise((ok,no)=>{let i=0;const nx=()=>{if(i>=urls.length){no();return}const sc=document.createElement('script');let done=false;const tm=setTimeout(()=>{if(!done){done=true;sc.remove();nx()}},7000);sc.src=urls[i++];sc.onload=()=>{if(!done){done=true;clearTimeout(tm);ok()}};sc.onerror=()=>{if(!done){done=true;clearTimeout(tm);nx()}};document.head.appendChild(sc)};nx()})}
async function loadZh(){
 const conv=()=>settings.zh==='simp'?T2S:S2T;let changed=false;

 if(settings.py&&!window.pinyinPro){try{await loadScript(['https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js','https://registry.npmmirror.com/pinyin-pro/latest/files/dist/index.js','https://unpkg.com/pinyin-pro@3/dist/index.js']);changed=true}catch(e){}}

}
const CJK=/[\u3400-\u9fff]/;
function zhConv(t){const c=settings.zh==='simp'?T2S:S2T;try{return c&&CJK.test(t)?c(t):t}catch(e){return t}}
function zhWalk(n){if(!(T2S&&S2T)||!n)return;if(n.nodeType===3){const v=zhConv(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}if(n.nodeType!==1||n.tagName==='TEXTAREA'||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
 if(n.placeholder&&CJK.test(n.placeholder))n.placeholder=zhConv(n.placeholder);const w=document.createTreeWalker(n,4);let x;const L=[];while(x=w.nextNode())L.push(x);L.forEach(t=>{if(t.parentNode&&t.parentNode.tagName!=='TEXTAREA'){const v=zhConv(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v}});n.querySelectorAll&&n.querySelectorAll('[placeholder]').forEach(i=>{if(CJK.test(i.placeholder))i.placeholder=zhConv(i.placeholder)})}
try{new MutationObserver(ms=>{if(!T2S)return;ms.forEach(m=>m.addedNodes.forEach(zhWalk))}).observe(document.body,{childList:true,subtree:true})}catch(e){}
function PY(text){const src=String(text??'');if(!settings.py||!window.pinyinPro||!CJK.test(src))return esc(src);

async function botAsk(qq){

 try{const kid=kidBy(st.kid);const r=await aiJson(botPrompt(kid,q),300);const ok=w=>typeof w==='string'&&/^[A-Za-z][A-Za-z' -]{0,30}$/.test(w.trim());

  else if(r.type==='word'&&ok(r.word)){const w=r.word.trim();if(HG[w.toLowerCase()])botChoose(HG[w.toLowerCase()]);else botShow(w,String(r.zh||''))}
  else{b.res={message:String(r.message||''),messageZh:String(r.messageZh||'')};b.phase='msg';renderBot()}}
 catch(e){b.phase='ask';renderBot();toast(AIERR[e&&e.code]||'Robo could not answer. Try again. 機器人沒回應，再試一次。')}
}
function mic(lang){
 const b=st.bot;if(!SR){toast('Use the microphone on the keyboard. 請用鍵盤上的麥克風。');return}
 try{const rec=new SR();rec.lang=lang==='zh'?'zh-CN':'en-US';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{const t=e.results[0][0].transcript;b.listen=null;b.q=t;renderBot();botAsk(t)};

  const k={id:e.id||('k'+Date.now().toString(36)),name,age:e.age,level:e.level,mode:e.mode,avatar:e.avatar||''};
  const i=settings.kids.findIndex(x=>x.id===k.id);if(i>=0)settings.kids[i]=k;else settings.kids.push(k);await saveSettings();st.view='parent';render();break}
 case 'delkid':if(!st.confirmDel){st.confirmDel=true;render();break}settings.kids=settings.kids.filter(k=>k.id!==st.edit.id);await saveSettings();st.view='parent';render();break;

 case 'review':st.rv={mode:'pen',sel:-1};renderReview();break;
 case 'why':st.rv.sel=+v;renderReview();break;
 case 'raStart':st.rv={mode:'better'};renderReview();break;
 case 'raStartOld':st.rv={mode:'ra',ss:splitS(st.fb.issues.length&&st.fb.corrected?st.fb.corrected:st.fb.text),i:0};if(!st.rv.ss.length)st.rv.ss=[st.fb.text];raPlay();break;
 case 'raAgain':raPlay();break;
 case 'raNext':{const r=st.rv;if(canSpeak)speechSynthesis.cancel();r.i++;if(r.i<r.ss.length)raPlay();else{r.phase='';await markReviewed();renderReview()}break}
 case 'raBetter':st.rv={mode:'ra',ss:splitS(st.fb.better),i:0,better:true};raPlay();break;
 case 'bot':st.bot={phase:'ask',q:'',tries:0};renderBot();break;
 case 'botAsk':botAsk();break;
 case 'botSpell':spellSay(st.bot.res.word);break;
 case 'botWord':say(st.bot.res.word);break;
 case 'botMem':st.bot.phase='spell';st.bot.tries=0;renderBot();break;
 case 'botLook':st.bot.phase='show';renderBot();break;
 case 'botCheck':{const b=st.bot,g=(($('#botg')||{}).value||'').trim().toLowerCase().replace(/\s+/g,' ');if(!g)break;if(g===b.res.word.toLowerCase()){b.phase='ok';renderBot();say('Great job! '+b.res.word)}else{b.tries++;renderBot()}break}
 case 'botAdd':{const w=st.bot.res.word;st.bot=null;closeSheet();insert(w);break}
 case 'botNew':st.bot={phase:'ask',q:'',tries:0};renderBot();break;
 case 'botClose':if(canSpeak)speechSynthesis.cancel();st.bot=null;closeSheet();break;
 case 'rvclose':if(canSpeak)speechSynthesis.cancel();st.rv=null;closeSheet();render();break;
 case 'rvfinish':st.rv=null;closeSheet();if(st.view==='pastOne'){render();break}saveDraft();break;
 case 'upwhy':{const f=st.rv?st.fb:(st.view==='pastOne'?(entries[eid(st.kid,st.pastDate)]||{}).fb:st.fb);const u=f&&f.ups&&f.ups[+v];if(u){toast(u.p+'：'+(u.zh||''));say(u.p)}break}
 case 'sayStar':{const f=st.view==='pastOne'&&!st.rv?(entries[eid(st.kid,st.pastDate)]||{}).fb:st.fb;if(f&&f.star)say(f.star.en);break}
 case 'regen':regen();break;
 case 'bver':{const e=entries[eid(st.kid,st.pastDate)];const f=e&&e.fb;if(!f||!f.versions)break;const vi=Math.max(0,Math.min(f.versions.length-1,(f.vi??f.versions.length-1)+(+v)));await useVersion(e,f.versions,vi);render();break}
 case 'selday':st.sel=v;render();break;
 case 'lookback':st.view='past';render();break;
 case 'past':st.view='past';render();break;
 case 'pwhy':st.psel=st.psel===+v?-1:+v;render();break;
 case 'pastOpen':st.psel=-1;st.pastDate=v;st.view='pastOne';render();break;
 case 'pastRead':{const e=entries[eid(st.kid,st.pastDate)];if(!e)break;st.date=e.date;st.fb=e.fb?{...e.fb,text:e.text}:{issues:[],text:e.text,corrected:'',better:''};st.rv={mode:'better'};renderReview();break}
 case 'readAll':if(st.rv){st.rv.playing=true;readFrom(0)}break;
 case 'stopRead':if(st.rv)st.rv.playing=false;if(canSpeak)speechSynthesis.cancel();hl(-1);break;
 case 'saySen':if(st.rv){st.rv.playing=false;hl(+v);say(st.rv.ss[+v])}break;
 case 'betterDone':{if(canSpeak)speechSynthesis.cancel();const past=st.view==='pastOne';st.rv=null;closeSheet();if(past){render();break}await markReviewed();saveDraft();break}
 case 'setZh':settings.zh=v;await saveSettings();render();loadZh();break;
 case 'togglePy':settings.py=!settings.py;await saveSettings();render();loadZh();break;
 case 'botBg':act('botClose');break;
 case 'botPick':botShow(v);break;
 case 'botNot':{const b=st.bot,w=b.res.word.toLowerCase();if(HG[w])botChoose(HG[w]);else{b.res={message:'Try saying it in Chinese.',messageZh:'試試用中文說，例如「寫字怎麼拼」。'};b.phase='msg';b.q='';renderBot()}break}
 case 'mic':mic(v);break;
 case 'avpick':$('#sheet').innerHTML=`<div class="sheetbg" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h2>Pick your avatar 選一個頭像</h2>${avGrid(kidBy(st.kid).avatar,'setav')}<button class="btn ghost full" data-a="close" style="margin-top:8px">Close 關閉</button></div></div>`;break;
 case 'setav':{const k=kidBy(st.kid);if(k){k.avatar=v;await saveSettings()}closeSheet();render();break}
 case 'pickA':st.edit.avatar=v;render();break;
 case 'savekey':settings.apiKey=($('#key')||{}).value.trim();await saveSettings();toast('Saved. 已儲存。');render();break;
 case 'testkey':{settings.apiKey=($('#key')||{}).value.trim();await saveSettings();toast('Testing… 測試中');try{const r=await aiJson('Return the json object {"ok":true}.');toast(r&&r.ok?'It works! 可以用了 ✓':'Got a reply. 有回應。')}catch(e){toast(AIERR[e&&e.code]||('Error '+(e&&e.status||'')+' 連線失敗'))}break}
 case 'export':saveBlob(new Blob([JSON.stringify({app:'lwd',v:1,settings,entries})],{type:'application/json'}),'diary-backup-'+ymd(today())+'.json');break;
 }
}
function newEdit(){st.edit={id:'',name:'',avatar:'',age:6,level:sugLevel(6),mode:sugMode(6),tL:false,tM:false}}
init();
}
</script>
</body></html>
