<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Writers Diary</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Diary"><meta name="theme-color" content="#2f5bea"><link rel="apple-touch-icon" href="icon.png">
<style>
/* VOICE: cheerful and calm, kid-sized, one task per screen
   IDEA: a school exercise book: blue cover, ruled pages, the teacher's red pen
   PICTURE: the ruled writing page itself; picture prompts drawn as flat little scenes
   COLOUR and TYPE: cover blue, pencil yellow, red-pen coral; rounded system type for titles and writing, system UI text
   LAYOUT: one 560px column, blue header band, sticky bottom action bar, sheets slide up */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fb,#0e1322);--card:light-dark(#fff,#171f35);--ink:light-dark(#18213a,#eef1fa);--mut:light-dark(#5b6580,#a4adc6);
--line:light-dark(#dde4f3,#2a3453);--blue:light-dark(#2f5bea,#6f8dff);--blueS:light-dark(#e9efff,#1c2851);--yel:#ffd23f;--yelS:light-dark(#fff6d6,#3a3214);
--red:light-dark(#e0464b,#ff7b7f);--redS:light-dark(#ffeceb,#3d1c22);--ok:light-dark(#178a57,#4fd39a);--okS:light-dark(#e4f7ee,#14352a);--org:light-dark(#d9730d,#ffae5c);--orgS:light-dark(#fff0e0,#3a2814)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'PingFang TC',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;position:sticky;top:0;z-index:5}
.top .in{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font:800 24px/1.1 ui-rounded,'PingFang TC',sans-serif;margin:0;flex:1}
.top small{display:block;font:600 13px system-ui,sans-serif;opacity:.85}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;flex:none}
.wrap{max-width:560px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(20,30,70,.06)}
h2{font:700 20px/1.2 ui-rounded,'PingFang TC',sans-serif;margin:0 0 8px}
.zh{color:var(--mut);font-size:14px}
.mut{color:var(--mut)}
.btn{min-height:52px;border-radius:16px;padding:0 20px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:var(--blue);color:#fff}.pri:disabled{opacity:.5}
.sec{background:var(--blueS);color:var(--blue)}
.ghost{color:var(--mut);font-weight:700;min-height:44px;padding:0 12px}
.danger{color:var(--red)}
.full{width:100%}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.kid{background:var(--card);border-radius:22px;padding:22px 12px;text-align:center;box-shadow:0 6px 18px rgba(20,30,70,.07)}
.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#fff;font:800 36px ui-rounded,'PingFang TC',sans-serif}
.kid b{display:block;font:700 22px ui-rounded,'PingFang TC',sans-serif}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--blueS);color:var(--blue)}
.tag.y{background:var(--yelS);color:light-dark(#8a6400,#ffd23f)}
.tag.g{background:var(--okS);color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.dot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;border:2px dashed var(--line);color:var(--mut);max-width:48px;margin:4px auto 0;width:100%}
.dot.done{background:var(--blue);border:0;color:#fff}.dot.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--yel)}.dot.fut{opacity:.45}.wk{background:none;padding:0}.dot.today{border:3px solid var(--yel);color:var(--ink)}.dot.rest{border:0;background:var(--yelS);color:light-dark(#8a6400,#ffd23f);font-size:11px}
.wk small{font-size:12px;color:var(--mut);font-weight:700}
.stats{display:flex;gap:10px;margin-top:14px}.stats div{flex:1;background:var(--bg);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font:800 24px ui-rounded,'PingFang TC',sans-serif}.stats span{font-size:12px;color:var(--mut);font-weight:700}
.prompt{background:var(--blue);color:#fff}.prompt .q{font:700 23px/1.25 ui-rounded,'PingFang TC',sans-serif}.prompt .zh{color:rgba(255,255,255,.85)}
.prompt svg{width:100%;height:auto;border-radius:14px;margin-top:12px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

.page{background:var(--card);border-radius:20px;padding:6px 16px 10px 46px;position:relative;box-shadow:0 6px 18px rgba(20,30,70,.06)}

.meter{display:flex;align-items:center;gap:10px;margin:12px 2px 0;font-weight:700;font-size:14px;color:var(--mut)}
.bar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(20,30,70,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:6}

mark.grammar,mark.capital,mark.punctuation{background:var(--blueS);color:var(--blue);text-decoration-color:var(--blue)}

.star{flex:none;width:26px;height:26px}

.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:10px;font:20px ui-rounded,sans-serif;min-height:52px}
.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pics button{background:var(--bg);border-radius:16px;padding:8px;text-align:center;font-weight:800}
.pics svg{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:6px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--bg);border-radius:14px;padding:8px 14px;min-height:48px;text-align:left}
.word b{font:700 19px ui-rounded,sans-serif;display:block}.word span{font-size:13px;color:var(--mut)}
.word.used{background:var(--yelS)}
label.f{display:block;font-weight:800;margin:16px 0 6px}
input.t,select.t{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:18px}
.choice{display:grid;gap:10px}
.choice button{text-align:left;border-radius:16px;border:2px solid var(--line);padding:12px 14px;background:var(--card)}
.choice button.on{border-color:var(--blue);background:var(--blueS)}
.choice b{font:700 18px ui-rounded,'PingFang TC',sans-serif}.choice p{margin:2px 0 0;font-size:14px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pin{font:800 32px ui-rounded,'PingFang TC',sans-serif;letter-spacing:.5em;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
.paper{background:#fff;color:#1b2033;border-radius:6px;padding:22px 20px;box-shadow:0 8px 24px rgba(20,30,70,.12);font-size:14px}
.paper h3{font:800 20px ui-rounded,'PingFang TC',sans-serif;margin:0;color:#2f5bea}.paper h4{font:800 14px system-ui,sans-serif;color:#2f5bea;border-bottom:1.5px solid #dde4f3;padding-bottom:4px;margin:18px 0 8px}
.paper .d{margin-bottom:10px}.paper .d b{font-size:13px}.paper .d p{margin:2px 0 0;font:15px/1.6 ui-rounded,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.paper .c{font:14px ui-rounded,sans-serif;margin:3px 0}.paper s{color:#e0464b}.paper .g{color:#178a57;font-weight:700}
.paper .lines div{border-bottom:1px solid #c9d1e6;height:26px}
.banner{background:var(--okS);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:700;margin-top:12px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.load{padding:80px 20px;text-align:center;color:var(--mut);font-weight:700}
.av{overflow:hidden}.av svg{width:100%;height:100%;display:block}
.avs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.avs button{border-radius:50%;aspect-ratio:1;padding:0;overflow:hidden;border:4px solid transparent;background:none}.avs button.on{border-color:var(--blue)}.avs svg{width:100%;height:100%;display:block}
.me{display:flex;align-items:center;gap:14px}.me .av{margin:0;width:72px;height:72px}
.rv{position:fixed;inset:0;background:var(--bg);z-index:12;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(16px + env(safe-area-inset-bottom))}
.rv .in{max-width:560px;margin:auto;min-height:100%;display:flex;flex-direction:column}
.steps{display:flex;gap:6px;align-items:center;margin:14px 56px 18px 0}.steps i{flex:1;height:8px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ok)}
.rv h2{font-size:24px}.rv .lab{font-weight:800;color:var(--mut);font-size:14px;margin:18px 0 6px}
.rv .before{font:19px/1.7 ui-rounded,sans-serif;color:var(--mut);overflow-wrap:anywhere}
.rv .after{font:700 26px/1.5 ui-rounded,sans-serif;background:var(--okS);border-radius:18px;padding:16px 18px;overflow-wrap:anywhere}
.rv .mini{font-size:15px;margin-top:10px;color:var(--mut)}.rv .mini b{color:var(--ok)}.rv .mini s{color:var(--red)}
.rv .grow{flex:1;min-height:24px}.rv .acts{display:grid;gap:10px}
.big{min-height:60px;font-size:19px}
.pen{font:21px/2.1 ui-rounded,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.pen .mk{border:0;background:var(--yelS);border-radius:8px;padding:0 5px;font:inherit;line-height:1.5;color:inherit}
.pen .mk.sel{outline:3px solid var(--yel)}
.pen del{color:var(--red);text-decoration:line-through 2px}.pen ins{color:var(--ok);font-weight:800;text-decoration:none}.pen .arr{color:var(--mut);margin:0 4px;font-size:.8em}.pen .up{color:var(--ok);font-weight:800;font-size:1.2em}.pen .cap{font:800 12px system-ui,sans-serif;color:var(--ok);background:var(--okS);border-radius:6px;padding:2px 5px;margin-left:5px;vertical-align:middle}
.why{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:4px;min-height:56px}
.ra p{font:21px/1.55 ui-rounded,sans-serif;margin:0 0 8px;padding:10px 14px;border-radius:14px;color:var(--mut);overflow-wrap:anywhere}
.ra p.cur{background:var(--blueS);color:var(--ink);font-weight:700;font-size:25px}.ra p.done{color:var(--ink)}
.turn{font-weight:800;font-size:18px;color:var(--blue);margin:10px 0;text-align:center}
.spell{font:800 38px/1.2 ui-rounded,sans-serif;letter-spacing:.06em;text-align:center;margin:6px 0;color:var(--blue);overflow-wrap:anywhere}
.robo{display:flex;gap:12px;align-items:center}.robo .av{width:60px;height:60px;margin:0;flex:none}
.bub{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 6px 18px rgba(20,30,70,.06)}
.blanks{font:800 30px ui-rounded,sans-serif;letter-spacing:.3em;text-align:center;color:var(--mut)}
.x{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 10px)}
</style>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dIdx=d=>(d.getDay()+6)%7;
const monday=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dIdx(d));
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const wc=t=>(t.match(/[A-Za-z']+/g)||[]).length;
const clone=o=>JSON.parse(JSON.stringify(o));
const COLORS=['#2f5bea','#e0464b','#178a57','#d9730d','#7c4ddb','#0f8fa3'];
const STAR='<svg class="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z" fill="#ffc21a" stroke="#d99a00" stroke-width="1"/></svg>';
const BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

const LEVELS={
 1:{name:'Level 1',zh:'入門 · 1–2 句',goal:8,sent:'1–2 sentences',vocab:2,desc:'Short sentences with fill-in starters. 填空式開頭，寫 1–2 句。'},
 2:{name:'Level 2',zh:'進階 · 3–4 句',goal:25,sent:'3–4 sentences',vocab:3,desc:'3–4 sentences and 3 new words. 寫 3–4 句，用上 3 個單字。'},
 3:{name:'Level 3',zh:'挑戰 · 5 句以上',goal:45,sent:'5+ sentences',vocab:5,desc:'5+ sentences, linking words and 5 new words. 寫 5 句以上，用 first/then/finally。'}};
const sugLevel=a=>a<=6?1:a<=8?2:3;
const sugMode=a=>a<=7?'simple':'strict';
const MODES={simple:{name:'Simple 簡單批改',desc:'Spelling, past tense, capitals and full stops. 拼字、時態、大寫、句號。'},
 strict:{name:'Strict 嚴格批改',desc:'Everything in Simple, plus grammar and a better way to write it. 再加文法，並提供更好的寫法。'}};

const TOPICS=[
 ['What did you eat today?','你今天吃了什麼？','Today I ate ___.'],
 ['What did you play today?','你今天玩了什麼？','Today I played ___ with ___.'],
 ['Who did you see today?','你今天見到了誰？','Today I saw ___.'],
 ['What did you learn at school?','你今天在學校學了什麼？','At school, I learned ___.'],
 ['What made you happy today?','今天什麼事讓你開心？','I was happy when ___.'],
 ['Where did you go today?','你今天去了哪裡？','Today I went to ___.'],
 ['What was the weather like?','今天天氣怎麼樣？','Today it was ___ outside.'],
 ['What did you do after school?','放學後你做了什麼？','After school, I ___.'],
 ['Tell me about a friend.','說說你的一個朋友。','My friend ___ is ___.'],
 ['What was hard today?','今天有什麼事很難？','Today ___ was hard for me.'],
 ['What did you see on the way home?','回家路上你看到了什麼？','On the way home, I saw ___.'],
 ['What do you want to do tomorrow?','明天你想做什麼？','Tomorrow I want to ___.']];
const STARTERS={1:['Today I ___.','It was ___.'],2:['After that, I ___.','I felt ___ because ___.'],3:['First, I ___. Then, ___.','The best part of my day was ___.','Finally, ___.']};
const VOCAB={
 1:'happy:開心,big:大,small:小,fun:好玩,cat:貓,dog:狗,ball:球,cake:蛋糕,play:玩,run:跑,eat:吃,park:公園,sun:太陽,rain:雨,book:書,friend:朋友,jump:跳,hot:熱,cold:冷,toy:玩具,mom:媽媽,dad:爸爸,red:紅色,swim:游泳',
 2:'delicious:好吃的,yesterday:昨天,because:因為,favorite:最喜歡的,exciting:刺激的,tired:累的,together:一起,outside:外面,quickly:很快地,noisy:吵鬧的,afternoon:下午,library:圖書館,sandwich:三明治,beautiful:美麗的,scary:可怕的,laugh:笑,finish:完成,busy:忙碌的,weekend:週末,later:後來,lucky:幸運的,sunny:晴朗的,hungry:餓的,classmate:同學',
 3:'although:雖然,suddenly:突然,finally:最後,however:然而,adventure:冒險,decided:決定了,amazing:驚人的,enjoyed:享受了,patient:有耐心的,surprised:驚訝的,challenge:挑戰,discover:發現,proud:驕傲的,practice:練習,imagine:想像,nervous:緊張的,celebrate:慶祝,especially:尤其,explore:探索,carefully:小心地,exhausted:筋疲力盡的,delighted:很高興的,energetic:精力充沛的,instead:反而'};
const vocabFor=(lv,seed)=>{const l=VOCAB[lv].split(',').map(x=>x.split(':'));const out=[];let s=seed;while(out.length<LEVELS[lv].vocab){s=(s*1103515245+12345)&0x7fffffff;const w=l[s%l.length];if(!out.includes(w))out.push(w)}return out};
const used=(text,w)=>new RegExp('\\b'+w+'(s|es|ed|d|ing)?\\b','i').test(text);

const sv=b=>`<svg viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;

let VOICE=null;
const NOVEL=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB|AU|IE|CA)/i.test(v.lang)&&!NOVEL.test(v.name));let best=null,bs=-1;for(const v of vs){let sc=0;if(/premium/i.test(v.name))sc+=6;if(/enhanced|natural|neural/i.test(v.name))sc+=4;if(/Ava|Samantha|Zoe|Allison|Susan|Evan|Nathan|Serena|Daniel|Karen|Moira/i.test(v.name))sc+=2;if(/^en[-_]US/i.test(v.lang))sc+=1;if(sc>bs){bs=sc;best=v}}VOICE=best}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function say(list,done,rate=.8){if(!canSpeak){if(done)done();return}try{speechSynthesis.cancel();const arr=Array.isArray(list)?list:[list];let fired=false;const fin=()=>{if(!fired){fired=true;if(done)done()}};arr.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'en-US';if(VOICE)u.voice=VOICE;u.rate=rate;if(i===arr.length-1){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)});if(done)setTimeout(fin,2500+arr.join(' ').length*120)}catch(e){if(done)done()}}
const speak=t=>say(t);
const spellSay=w=>say([...w.toUpperCase().replace(/[^A-Z]/g,'')].join(', ')+'. '+w+'.',null,.7);

async function aiJson(prompt){
 const key=(settings.apiKey||'').trim();if(!key)throw {code:'nokey'};
 let r;try{r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
  body:JSON.stringify({model:'deepseek-chat',temperature:0.2,max_tokens:1500,response_format:{type:'json_object'},messages:[{role:'system',content:'You are a helpful English teacher. Reply with a json object only.'},{role:'user',content:prompt}]})})}catch(e){throw {code:'network'}}
 if(r.status===401)throw {code:'badkey'};if(r.status===402)throw {code:'nobalance'};if(r.status===429)throw {code:'rate_limited'};if(!r.ok)throw {code:'http',status:r.status};
 const j=await r.json();let t=(((j.choices||[])[0]||{}).message||{}).content||'';t=t.replace(/^```(json)?|```$/g,'').trim();return JSON.parse(t);
}

const splitS=t=>String(t||'').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
function fixHTML(w,r){
 if(w.toLowerCase()===r.toLowerCase()&&w.length===r.length)return [...r].map((c,i)=>c!==w[i]?`<span class="up">${esc(c)}</span>`:esc(c)).join('')+'<span class="cap">大寫</span>';
 if(r.startsWith(w)&&r.length>w.length)return esc(w)+`<span class="up">${esc(r.slice(w.length))}</span>`;
 if(r.toLowerCase().startsWith(w.toLowerCase())&&r.length>w.length)return fixHTML(w,r.slice(0,w.length))+`<span class="up">${esc(r.slice(w.length))}</span>`;
 return `<del>${esc(w)}</del><span class="arr">→</span><ins>${esc(r)}</ins>`;
}
function core(w,r){
 const W=w.split(' '),Rt=r.split(' ');let p=0;while(p<W.length&&p<Rt.length&&W[p]===Rt[p])p++;
 let q=0;while(q<W.length-p&&q<Rt.length-p&&W[W.length-1-q]===Rt[Rt.length-1-q])q++;
 const off=W.slice(0,p).join(' ').length+(p?1:0);const cw=W.slice(p,W.length-q).join(' '),cr=Rt.slice(p,Rt.length-q).join(' ');
 return {off,cw,cr};
}
function penHTML(text,issues,sel){
 const rg=[],lt=text.toLowerCase();
 issues.forEach((x,i)=>{if(!x.wrong)return;const c=core(x.wrong,x.right);
  let p=text.indexOf(x.wrong);if(p<0)p=lt.indexOf(x.wrong.toLowerCase());
  while(p>=0){const s0=p+c.off,e0=s0+c.cw.length;if(!rg.some(r=>c.cw?(s0<r.e&&e0>r.s):(s0>r.s&&s0<r.e)))break;p=text.indexOf(x.wrong,p+1)}
  if(p<0||!c.cr&&!c.cw)return;const s0=p+c.off;rg.push({s:s0,e:s0+c.cw.length,i,cw:c.cw,cr:c.cr})});
 rg.sort((a,b)=>a.s-b.s||a.e-b.e);let o='',c=0;
 for(const r of rg){if(r.s<c)continue;const inner=r.cw?fixHTML(text.slice(r.s,r.e),r.cr):`<span class="up">${esc(r.cr)}</span>`;
  o+=esc(text.slice(c,r.s))+`<button class="mk ${r.i===sel?'sel':''}" data-a="why" data-v="${r.i}">${inner}</button>${r.cw?'':' '}`;c=r.e}
 const miss=issues.map((_,i)=>i).filter(i=>!rg.some(r=>r.i===i));
 return {html:o+esc(text.slice(c)),miss};
}

  ${n?`<div class="why">${x?`<div><b style="font-size:18px"><span style="color:var(--red)">${esc(x.wrong)}</span> → <span style="color:var(--ok)">${esc(x.right)}</span></b> <span class="tag ${x.type==='tense'?'y':''}">${TYPES[x.type][0]} ${TYPES[x.type][1]}</span></div><div class="mut" style="margin-top:4px">${esc(x.tipZh||'')}${x.tipZh&&x.tip?' · ':''}${esc(x.tip||'')}</div>`:'<span class="mut">Tap a yellow word above. 點上面黃色的字，看看為什麼要這樣改。</span>'}</div>`:''}

  if(!settings.pin){settings.pin=p;await saveSettings();st.parent=true;st.view=settings.kids.length?'parent':'edit';if(!settings.kids.length)newEdit();render()}
  else if(p===settings.pin){st.parent=true;st.view='parent';render()}else toast('Wrong PIN. 密碼不對。');break}
 case 'resetpin':settings.pin='';st.parent=false;st.view='pin';render();break;
 case 'editkid':{if(v){const k=kidBy(v);st.edit={...k,tL:true,tM:true}}else newEdit();st.confirmDel=false;st.view='edit';render();break}
 case 'pickL':st.edit.level=+v;st.edit.tL=true;render();break;
 case 'pickM':st.edit.mode=v;st.edit.tM=true;render();break;
 case 'savekid':{const e=st.edit,name=(e.name||'').trim();if(!name){toast('Please type a name. 請輸入名字。');break}
  const k={id:e.id||('k'+Date.now().toString(36)),name,age:e.age,level:e.level,mode:e.mode,avatar:e.avatar||''};
  const i=settings.kids.findIndex(x=>x.id===k.id);if(i>=0)settings.kids[i]=k;else settings.kids.push(k);await saveSettings();st.view='parent';render();break}
 case 'delkid':if(!st.confirmDel){st.confirmDel=true;render();break}settings.kids=settings.kids.filter(k=>k.id!==st.edit.id);await saveSettings();st.view='parent';render();break;
 case 'levelup':{const k=kidBy(v);k.level=Math.min(3,k.level+1);await saveSettings();toast(k.name+' is now '+LEVELS[k.level].name+'!');render();break}
 case 'week':st.kid=v;st.wk=0;st.view='week';render();break;
 case 'wk':st.wk=Math.min(0,st.wk+(+v));render();break;
 case 'pdf':pdf();break;
 case 'review':st.rv={mode:'pen',sel:-1};renderReview();break;
 case 'why':st.rv.sel=+v;renderReview();break;
 case 'raStart':st.rv={mode:'ra',ss:splitS(st.fb.issues.length&&st.fb.corrected?st.fb.corrected:st.fb.text),i:0};if(!st.rv.ss.length)st.rv.ss=[st.fb.text];raPlay();break;
 case 'raAgain':raPlay();break;
 case 'raNext':{const r=st.rv;if(canSpeak)speechSynthesis.cancel();r.i++;if(r.i<r.ss.length)raPlay();else{r.phase='';await markReviewed();renderReview()}break}
 case 'raBetter':st.rv={mode:'ra',ss:splitS(st.fb.better),i:0,better:true};raPlay();break;
 case 'bot':st.bot={phase:'ask',q:'',tries:0};renderBot();break;
 case 'botAsk':botAsk();break;
 case 'botSpell':spellSay(st.bot.res.word);break;
 case 'botWord':say(st.bot.res.word);break;
 case 'botMem':st.bot.phase='spell';st.bot.tries=0;renderBot();break;
 case 'botLook':st.bot.phase='show';renderBot();break;
 case 'botCheck':{const b=st.bot,g=(($('#botg')||{}).value||'').trim().toLowerCase().replace(/\s+/g,' ');if(!g)break;if(g===b.res.word.toLowerCase()){b.phase='ok';renderBot();say('Great job! '+b.res.word)}else{b.tries++;renderBot()}break}
 case 'botAdd':{const w=st.bot.res.word;st.bot=null;closeSheet();insert(w);break}
 case 'botNew':st.bot={phase:'ask',q:'',tries:0};renderBot();break;
 case 'botClose':if(canSpeak)speechSynthesis.cancel();st.bot=null;closeSheet();break;
 case 'rvclose':if(canSpeak)speechSynthesis.cancel();st.rv=null;closeSheet();render();break;
 case 'rvfinish':st.rv=null;closeSheet();if(st.view==='pastOne'){render();break}saveDraft();break;
 case 'selday':st.sel=v;render();break;
 case 'lookback':st.view='past';render();break;
 case 'past':st.view='past';render();break;
 case 'pastOpen':st.pastDate=v;st.view='pastOne';render();break;
 case 'pastRead':{const e=entries[eid(st.kid,st.pastDate)];if(!e)break;st.date=e.date;st.fb=e.fb?{...e.fb,text:e.text}:{issues:[],text:e.text,corrected:'',better:''};const t=st.fb.issues&&st.fb.issues.length&&st.fb.corrected?st.fb.corrected:e.text;st.rv={mode:'ra',ss:splitS(t),i:0};if(!st.rv.ss.length)st.rv.ss=[e.text];raPlay();break}
 case 'avpick':$('#sheet').innerHTML=`<div class="sheetbg" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h2>Pick your avatar 選一個頭像</h2>${avGrid(kidBy(st.kid).avatar,'setav')}<button class="btn ghost full" data-a="close" style="margin-top:8px">Close 關閉</button></div></div>`;break;
 case 'setav':{const k=kidBy(st.kid);if(k){k.avatar=v;await saveSettings()}closeSheet();render();break}
 case 'pickA':st.edit.avatar=v;render();break;
 case 'savekey':settings.apiKey=($('#key')||{}).value.trim();await saveSettings();toast('Saved. 已儲存。');render();break;
 case 'testkey':{settings.apiKey=($('#key')||{}).value.trim();await saveSettings();toast('Testing… 測試中');try{const r=await aiJson('Return the json object {"ok":true}.');toast(r&&r.ok?'It works! 可以用了 ✓':'Got a reply. 有回應。')}catch(e){toast(AIERR[e&&e.code]||('Error '+(e&&e.status||'')+' 連線失敗'))}break}
 case 'export':saveBlob(new Blob([JSON.stringify({app:'lwd',v:1,settings,entries})],{type:'application/json'}),'diary-backup-'+ymd(today())+'.json');break;
 }
}
function newEdit(){st.edit={id:'',name:'',avatar:'',age:6,level:sugLevel(6),mode:sugMode(6),tL:false,tM:false}}
init();
}
</script>
</body></html>
