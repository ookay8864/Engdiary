<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Writers Diary</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Diary"><meta name="theme-color" content="#2f5bea"><link rel="apple-touch-icon" href="icon.png">
<style>
/* VOICE: cheerful and calm, kid-sized, one task per screen
   IDEA: a school exercise book: blue cover, ruled pages, the teacher's red pen
   PICTURE: the ruled writing page itself; picture prompts drawn as flat little scenes
   COLOUR and TYPE: cover blue, pencil yellow, red-pen coral; rounded system type for titles and writing, system UI text
   LAYOUT: one 560px column, blue header band, sticky bottom action bar, sheets slide up */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fb,#0e1322);--card:light-dark(#fff,#171f35);--ink:light-dark(#18213a,#eef1fa);--mut:light-dark(#5b6580,#a4adc6);
--line:light-dark(#dde4f3,#2a3453);--blue:light-dark(#2f5bea,#6f8dff);--blueS:light-dark(#e9efff,#1c2851);--yel:#ffd23f;--yelS:light-dark(#fff6d6,#3a3214);
--red:light-dark(#e0464b,#ff7b7f);--redS:light-dark(#ffeceb,#3d1c22);--ok:light-dark(#178a57,#4fd39a);--okS:light-dark(#e4f7ee,#14352a);--org:light-dark(#d9730d,#ffae5c);--orgS:light-dark(#fff0e0,#3a2814)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body,button,a,label,input,select,textarea{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'PingFang TC',sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;position:sticky;top:0;z-index:5}
.top .in{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font:800 24px/1.1 ui-rounded,'PingFang TC',sans-serif;margin:0;flex:1}
.top small{display:block;font:600 13px system-ui,sans-serif;opacity:.85}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;flex:none}
.wrap{max-width:560px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(20,30,70,.06)}

.zh{color:var(--mut);font-size:14px}
.mut{color:var(--mut)}

.sec{background:var(--blueS);color:var(--blue)}
.ghost{color:var(--mut);font-weight:700;min-height:44px;padding:0 12px}

.full{width:100%}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}

.kid{width:100%;background:none;border-radius:0;padding:22px 12px 12px;text-align:center}
.kidreport{width:calc(100% - 20px);min-height:44px;margin:8px 10px 10px;border-radius:14px;background:var(--blueS);color:var(--blue);font-weight:800;font-size:15px}
.cWelcome{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 2px 18px}
.cWelcome h2{font-size:25px;margin:0}.cWelcome p{margin:5px 0 0;color:var(--mut);font-size:13px}

.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#fff;font:800 36px ui-rounded,'PingFang TC',sans-serif}

.dot.done{background:var(--blue);border:0;color:#fff}.dot.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--yel)}.dot.fut{opacity:.45}.wk{background:none;padding:0}.dot.today{border:3px solid var(--yel);color:var(--ink)}.dot.rest{border:0;background:var(--yelS);color:light-dark(#8a6400,#ffd23f);font-size:11px}

.prompt{background:var(--blue);color:#fff}.prompt .q{font:700 23px/1.25 ui-rounded,'PingFang TC',sans-serif}.prompt .zh{color:rgba(255,255,255,.85)}

.meter{display:flex;align-items:center;gap:10px;margin:12px 2px 0;font-weight:700;font-size:14px;color:var(--mut)}
.bar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -6px 20px rgba(20,30,70,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:6}
.dock .in{max-width:560px;margin:auto;display:flex;gap:10px}.dock .btn{flex:1;font-size:16px;padding:0 10px;white-space:nowrap}
.fb .txt{font:19px/1.9 ui-rounded,'PingFang TC',sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}

.starbox{background:var(--yelS);border-radius:16px;padding:12px 14px;margin-top:4px}.starbox .sen{font:700 20px/1.5 ui-rounded,sans-serif;margin:4px 0}

.words{display:flex;flex-wrap:wrap;gap:8px}

label.f{display:block;font-weight:800;margin:16px 0 6px}

.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px 28px;justify-content:center;-webkit-user-select:none;user-select:none}.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font:400 28px system-ui,-apple-system,sans-serif;color:var(--ink)}.pad button:active{background:var(--line)}.pad button[data-v=del]{border:none;background:none;font-size:24px;color:var(--mut)}

function ladderState(kid){if(!kid.lad)kid.lad={t:0,used:[],rev:[]};return kid.lad}
function dailyWords(kid,date){
 const L=ladderState(kid);if(L.day&&L.day.date===date&&L.day.t===L.t)return L.day.w;
 const tw=tierWords(kid,L.t),fresh=tw.filter(w=>!L.used.includes(w[0])),pool=fresh.length>=2?fresh:tw;let sd=hash(date+kid.id);const pick=[];
 const nx=()=>{sd=(sd*1103515245+12345)&0x7fffffff;return sd};
 while(pick.length<2){const w=pool[nx()%pool.length];if(!pick.includes(w))pick.push(w)}
 if(L.rev.length){const r=L.rev[nx()%L.rev.length];pick.push([r[0],r[1],1])}else{const rest=pool.filter(w=>!pick.includes(w));if(rest.length)pick.push(rest[nx()%rest.length])}
 L.day={date,t:L.t,w:pick};return pick;
}
function ladderUpdate(kid,text){
 const L=ladderState(kid),tw=tierWords(kid,L.t);
 tw.forEach(w=>{if(!L.used.includes(w[0])&&used(text,w[0]))L.used.push(w[0])});
 L.rev=L.rev.filter(r=>!used(text,r[0]));
 if(L.used.length>=8&&L.t<3){const left=tw.filter(w=>!L.used.includes(w[0]));L.rev=[...L.rev,...left].slice(-10);L.t++;L.used=[];L.day=null;st.lvlUp=kid.id}
 saveSettings();
}

 for(const r of B.rows){
  const ws=r.none?[{t:'(no entry)',c:[152,162,189]}]:r.segs.map(g=>g.sup?{sup:g.sup}:{t:g.t,u:g.u?RED:null});

   if(r.pic.pick!=='R')put('a',r.pic.pick==='LR'?'1':'');if(r.pic.pick!=='L')put('b',r.pic.pick==='LR'?'2':'')}
  rich(ws,C1+PAD,y+PAD+thH,C2-C1-2*PAD,10.5,1.38,true);rich(corrSegs(r),C2+PAD,y+PAD,CE-C2-2*PAD,8.3,1.35,true);
  doc.setDrawColor(221,228,243);doc.setLineWidth(.3);doc.line(C0,y+rh,CE,y+rh);doc.line(C1,y,C1,y+rh);doc.line(C2,y,C2,y+rh);y+=rh}
 const sec=t=>{if(y+14>BOT){doc.addPage();y=header(false)}y+=4;doc.setFont('helvetica','bold');doc.setFontSize(11.5);doc.setTextColor(...BLUE);doc.text(t,M,y+4);y+=5.5;doc.setDrawColor(221,228,243);doc.setLineWidth(.4);doc.line(M,y,PW-M,y);y+=2.5};

  for(const r of bet){const t=r.better,lt=t.toLowerCase(),rg=[];(r.ups||[]).forEach(u=>{const p=lt.indexOf(u.p.toLowerCase());if(p>=0&&!rg.some(q=>p<q.e&&p+u.p.length>q.s))rg.push({s:p,e:p+u.p.length})});rg.sort((a,b)=>a.s-b.s);
   const sg=[{t:DAYL[r.i]+': ',b:1}];let c=0;rg.forEach(q=>{sg.push({t:t.slice(c,q.s),i:1});sg.push({t:t.slice(q.s,q.e),i:1,u:ORG,wv:1});c=q.e});sg.push({t:t.slice(c),i:1});

}

async function act(a,v){
 switch(a){

 case 'week':st.kid=v;st.wk=0;st.weekReadOnly=false;st.view='week';render();break;
 case 'kidweek':st.kid=v;st.wk=0;st.weekReadOnly=true;st.view='week';render();break;
 case 'weekKid':st.kid=v;st.weekReadOnly=false;render();break;
 case 'wk':st.wk=Math.min(0,st.wk+(+v));render();break;
 case 'pdf':pdf();break;

 case 'bot':botNew();renderBot();break;
 case 'botAsk':botAsk();break;

 case 'botType':st.bot.typing=!st.bot.typing;renderBot();break;

 case 'mic':mic();break;
 case 'botPick':st.bot.log.push({me:v});botShow(v);break;
 case 'botAgain':st.bot.phase='ask';st.bot.cur=null;renderBot();break;
 case 'botSpell':spellSay(st.bot.cur.word);break;
 case 'botWord':say(st.bot.cur.word);break;
